<article class="group overflow-hidden rounded-3xl border border-white/50 bg-white/70 p-4 shadow-[0_20px_80px_rgba(15,23,42,0.08)] backdrop-blur-xl transition duration-300 hover:-translate-y-2 hover:shadow-[0_30px_120px_rgba(8,145,178,0.2)] dark:border-slate-800 dark:bg-slate-900/70">
  <img [src]="project.image" [alt]="project.title" class="h-48 w-full rounded-2xl object-cover transition duration-500 group-hover:scale-105" />
  <div class="mt-5">
    <div class="flex items-center justify-between gap-3">
      <span class="rounded-full bg-cyan-500/10 px-3 py-1 text-xs font-semibold uppercase tracking-[0.3em] text-cyan-600">{{ project.category }}</span>
      <span class="text-sm text-slate-500">{{ project.date }}</span>
    </div>
    <h3 class="mt-4 text-xl font-semibold text-slate-900 dark:text-white">{{ project.title }}</h3>
    <p class="mt-3 text-sm leading-7 text-slate-600 dark:text-slate-300">{{ project.summary }}</p>
    <div class="mt-4 flex flex-wrap gap-2">
      <span *ngFor="let tech of project.tech" class="rounded-full border border-slate-200 px-2.5 py-1 text-xs text-slate-600 dark:border-slate-700 dark:text-slate-300">{{ tech }}</span>
    </div>
    <div class="mt-6 flex gap-3">
      <a [href]="project.github" target="_blank" rel="noreferrer" class="rounded-full border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 transition hover:border-cyan-500 hover:text-cyan-600 dark:border-slate-700 dark:text-slate-300">GitHub</a>
      <a [href]="project.live" target="_blank" rel="noreferrer" class="rounded-full bg-slate-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-cyan-600 dark:bg-cyan-600 dark:hover:bg-cyan-500">Live Demo</a>
    </div>
  </div>
</article>
