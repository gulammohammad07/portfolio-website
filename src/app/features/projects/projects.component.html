<section class="px-4 py-20 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-7xl">
    <div class="max-w-3xl">
      <p class="text-sm uppercase tracking-[0.35em] text-cyan-600">Projects</p>
      <h1 class="mt-4 text-4xl font-semibold text-slate-900 dark:text-white">Selected work with premium execution and thoughtful detail.</h1>
      <p class="mt-4 text-lg leading-8 text-slate-600 dark:text-slate-300">Each project is designed to balance visual impact, user clarity, and long-term scalability.</p>
    </div>
    <div class="mt-12 grid gap-6 lg:grid-cols-3">
      <app-project-card *ngFor="let project of projects" [project]="project"></app-project-card>
    </div>
  </div>
</section>
