<section class="px-4 py-20 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-7xl">
    <div class="max-w-3xl">
      <p class="text-sm uppercase tracking-[0.35em] text-cyan-600">Services</p>
      <h1 class="mt-4 text-4xl font-semibold text-slate-900 dark:text-white">Premium frontend services tailored to high-growth brands.</h1>
      <p class="mt-4 text-lg leading-8 text-slate-600 dark:text-slate-300">I help teams transform product ideas into polished, conversion-focused digital experiences.</p>
    </div>
    <div class="mt-12 grid gap-6 md:grid-cols-2 xl:grid-cols-4">
      <div *ngFor="let service of services" class="rounded-[2rem] border border-white/70 bg-white/70 p-8 shadow-[0_20px_50px_rgba(15,23,42,0.06)] backdrop-blur-xl dark:border-slate-800 dark:bg-slate-900/70">
        <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-cyan-500 to-fuchsia-500 text-lg text-white"><i [class]="service.icon"></i></div>
        <h3 class="mt-6 text-xl font-semibold text-slate-900 dark:text-white">{{ service.title }}</h3>
        <p class="mt-4 text-sm leading-7 text-slate-600 dark:text-slate-300">{{ service.description }}</p>
      </div>
    </div>
  </div>
</section>
