<section
  class="relative isolate overflow-hidden px-4 py-20 sm:px-6 lg:px-8 lg:py-28"
>
  <div
    class="absolute inset-0 -z-10 bg-[radial-gradient(circle_at_top_right,_rgba(34,211,238,0.25),_transparent_35%),radial-gradient(circle_at_bottom_left,_rgba(232,121,249,0.2),_transparent_35%)]"
  ></div>

  <div
    class="mx-auto grid max-w-7xl items-center gap-12 lg:grid-cols-[1.1fr_0.9fr]"
  >
    <!-- Left Content -->
    <div>
      <!-- Badge -->
      <p
        #badge
        class="inline-flex rounded-full border border-cyan-400/30 bg-cyan-400/10 px-4 py-2 text-sm font-medium text-cyan-700 dark:text-cyan-300"
      >
        Open to frontend developer roles and growth opportunities
      </p>

      <!-- Heading -->
      <h1
        #heading
        class="mt-8 text-4xl font-semibold leading-tight text-slate-900 sm:text-6xl lg:text-7xl dark:text-white"
      >
        I’m a experienced

        <span
          class="bg-gradient-to-r from-cyan-500 to-fuchsia-500 bg-clip-text text-transparent"
        >
          Frontend Developer
        </span>

        building responsive Angular and Spartacus experiences.
      </h1>

      <!-- Tagline -->
      <p
        #tagline
        class="mt-6 max-w-2xl text-lg leading-8 text-slate-600 dark:text-slate-300"
      >
        {{ personalInfo.tagline }}
      </p>

      <!-- Buttons -->
      <div #buttons class="mt-8 flex flex-wrap gap-4">
        <a
          routerLink="/contact"
          class="rounded-full bg-slate-900 px-6 py-3 text-sm font-semibold text-white transition hover:bg-cyan-600 dark:bg-cyan-600 dark:hover:bg-cyan-500"
        >
          Hire Me
        </a>

        <a
          [href]="personalInfo.resumeUrl"
          download="Gulam_Resume.pdf"
          target="_blank"
          class="rounded-full border border-slate-300 px-6 py-3 text-sm font-semibold text-slate-700 transition hover:border-cyan-500 hover:text-cyan-600 dark:border-slate-700 dark:text-slate-200"
        >
          Download Resume
        </a>

        <a
          routerLink="/projects"
          class="rounded-full border border-slate-300 px-6 py-3 text-sm font-semibold text-slate-700 transition hover:border-cyan-500 hover:text-cyan-600 dark:border-slate-700 dark:text-slate-200"
        >
          View Projects
        </a>
      </div>

      <!-- Social Icons -->
      <div #social class="mt-8 flex flex-wrap gap-4">
        <a
          *ngFor="let link of socialLinks"
          [href]="link.href"
          target="_blank"
          rel="noreferrer"
          class="rounded-full border border-slate-200 bg-white/70 p-3 text-slate-700 shadow-sm transition hover:-translate-y-1 hover:text-cyan-600 dark:border-slate-800 dark:bg-slate-900/70 dark:text-slate-300"
        >
          <i [class]="link.icon"></i>
        </a>
      </div>
    </div>

    <!-- Right Content -->
    <div class="relative">
      <div
        class="absolute inset-0 -translate-x-6 translate-y-8 rounded-[2rem] bg-gradient-to-br from-cyan-400/30 to-fuchsia-400/30 blur-3xl"
      ></div>

      <div
        #profile
        class="relative overflow-hidden rounded-[2rem] border border-white/70 bg-white/70 p-4 shadow-[0_40px_120px_rgba(15,23,42,0.16)] backdrop-blur-xl dark:border-slate-800 dark:bg-slate-900/70"
      >
        <img
          [src]="personalInfo.profileImage"
          [alt]="personalInfo.name"
          class="h-[480px] w-full rounded-[1.5rem] object-cover"
        />
      </div>
    </div>
  </div>
</section>
